name: My First CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f README.md
          echo "Project files checked successfully!"
